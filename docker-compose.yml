name: rideflow

x-api-env: &api-env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8010}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-rideflow}
  DB_USER: ${DB_USER:-rideflow_app}
  DB_PASSWORD: ${DB_PASSWORD:-dev-app-password}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS:-900}
  JWT_REFRESH_SECONDS: ${JWT_REFRESH_SECONDS:-1209600}
  OTP_PROVIDER: ${OTP_PROVIDER:-dev}
  OTP_DEV_CODE: ${OTP_DEV_CODE:-000000}
  DEMO_PLATFORM_ADMIN_PHONE: ${DEMO_PLATFORM_ADMIN_PHONE:-+967700000000}
  DEMO_PLATFORM_ADMIN_PASSWORD: ${DEMO_PLATFORM_ADMIN_PASSWORD:-change-me-local-only}
  SEED_DEMO_ON_START: ${SEED_DEMO_ON_START:-0}
  ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-1}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideflow}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-dev-postgres-password}
      APP_DB_USER: ${DB_USER:-rideflow_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-dev-app-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./services/api
    image: rideflow-api:dev
    environment: *api-env
    command: ["/app/docker/entrypoint.sh"]
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      - ./services/api:/app
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  admin:
    build:
      context: ./apps/admin
    image: rideflow-admin:dev
    environment:
      # Server-side only: the browser talks to this BFF, which calls the API over the compose network.
      API_INTERNAL_URL: http://api:8000
      # Local development is plain http on localhost; set to true (default) behind HTTPS.
      COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      DEFAULT_WORKSPACE: ${ADMIN_DEFAULT_WORKSPACE:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: rideflow-api:dev
    environment: *api-env
    # Applies ride timers (bid expiry, confirmation timeout, unmatched expiry) every 5 seconds.
    command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do sleep 3; done; exec python manage.py process_timeouts --loop 5"]
    volumes:
      - ./services/api:/app
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  media:
