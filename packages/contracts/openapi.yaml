openapi: 3.0.3
info:
  title: RideFlow API
  version: 1.0.0-phase1
  description: 'Multi-tenant ride-hailing backend. Tenant is resolved from the authenticated
    token (claim `tid`), never from client payloads. Mutations on critical resources
    require an `Idempotency-Key` header; ride lifecycle actions also require `expected_version`.
    WebSocket hints: `/ws/v1/events/?token=<access>`.'
paths:
  /api/v1/admin/appeals:
    get:
      operationId: admin_appeals_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - pending
          - rejected
          - upheld
        description: |-
          * `pending` - Pending
          * `upheld` - Upheld (violation overturned)
          * `rejected` - Rejected
      - in: query
        name: violation
        schema:
          type: string
          format: uuid
      tags:
      - admin-trust
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppealList'
          description: ''
  /api/v1/admin/appeals/{id}:
    get:
      operationId: admin_appeals_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: نوع نص UUID يحدد هذا appeal.
        required: true
      tags:
      - admin-trust
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
          description: ''
