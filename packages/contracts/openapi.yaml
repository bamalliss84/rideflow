  /api/v1/rides:
    get:
      operationId: rides_list
      description: |-
        Rider and driver ride API. Every mutation requires `Idempotency-Key`; lifecycle changes also require
        `expected_version` (optimistic concurrency, 409 on mismatch).
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - arrived
            - assigned
            - bidding
            - cancelled
            - completed
            - disputed
            - en_route
            - in_progress
            - match_pending
            - no_show
            - requested
        description: |-
          * `requested` - Requested
          * `bidding` - Bidding
          * `match_pending` - Awaiting driver confirmation
          * `assigned` - Assigned
          * `en_route` - Driver en route
          * `arrived` - Driver arrived
          * `in_progress` - In progress
          * `completed` - Completed
          * `cancelled` - Cancelled
          * `no_show` - Rider no-show
          * `disputed` - Disputed
        explode: true
        style: form
      tags:
      - rides
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRideList'
          description: ''
    post:
      operationId: rides_create
      description: |-
        Rider and driver ride API. Every mutation requires `Idempotency-Key`; lifecycle changes also require
