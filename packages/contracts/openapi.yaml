            schema:
              $ref: '#/components/schemas/AppealDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppealDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppealDecisionRequest'
        required: true
      security:
