name: rideflow_rider
description: RideFlow rider app (Android). Talks only to the RideFlow API; the backend decides every permission and state.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.19.0
  dio: 5.7.0
  flutter_riverpod: 2.6.1
  go_router: 14.6.2
  flutter_secure_storage: 9.2.2
  web_socket_channel: 3.0.1
  geolocator: 13.0.2
  uuid: 4.5.1
  url_launcher: 6.3.1
  flutter_map: 7.0.2
  # Phone notifications while the app is closed (server: apps/notifications/push.py).
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  generate: true
  # Tajawal and Cairo (SIL Open Font License 1.1, assets/fonts/OFL.txt and OFL-Cairo.txt), bundled: no runtime font download.
  # The Cairo files are fixed weights made from Google Fonts' variable file, since Flutter doesn't pick a weight from one on its own.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

# geolocator_android 4.6.2 needs the Flutter >= 3.27 Gradle plugin (flutter.compileSdkVersion in plugin
# projects); this machine uses Flutter 3.24.5. 4.6.1 is the same API with a fixed compileSdk.
dependency_overrides:
  geolocator_android: 4.6.1
